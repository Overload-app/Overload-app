name: Workout reminders
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send this hour's reminders
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=overload-push-cron" | jq -r .value)
          curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" https://www.overload-app.com/api/push-cron
